<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Squashers</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* Big screen at the Tech Cell stall. Refreshes itself. */
  main { max-width: 900px; }
  .hero { text-align: center; margin: 10px 0 24px; }
  .hero h1 { font-size: 3.4rem; }
  .hero .kicker { font-size: 1.6rem; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 18px; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--blue); padding: 14px 20px; margin: 0 6px 14px 0; background: #fff; font-size: 1.5rem; font-weight: 700; }
  li .rank { font-family: "DM Sans", system-ui, sans-serif; color: var(--blue); min-width: 64px; }
  li.first { background: #fff7e0; box-shadow: 5px 5px 0 #ffbd44; font-size: 1.9rem; }
  li .when { margin-left: auto; font-size: 1rem; font-weight: 500; color: var(--muted); }
  .fast { margin: 30px 0 10px; }
  .fast h2 { font-size: 1.6rem; text-align: center; }
  li .stat { font-size: 1rem; font-weight: 600; color: var(--muted); }
  li .hearts { color: #ff605c; letter-spacing: 2px; font-size: 1.1rem; }
  .empty { text-align: center; font-size: 1.4rem; color: var(--muted); margin-top: 40px; }
  .how { text-align: center; color: var(--muted); margin-top: 26px; font-size: 1.1rem; }
  @media (max-width: 600px) {
    .hero h1 { font-size: 2.6rem; }
    li, li.first { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 14px; font-size: 1.2rem; }
    li .rank { grid-row: 1 / span 2; min-width: 0; align-self: center; }
    li .name { grid-column: 2; overflow-wrap: anywhere; }
    li .hearts { grid-column: 3; grid-row: 1; justify-self: end; white-space: nowrap; }
    li .when { grid-column: 3; grid-row: 2; justify-self: end; margin: 0; font-size: .82rem; white-space: nowrap; }
  }
</style>
</head>
<body>
<main>
  <header class="top"><img src="/logo.png" alt=""><span>NUS Students'<br>Computing Club</span></header>
  <div class="hero">
    <p class="kicker">commit-tea.</p>
    <h1>Bug Squashers</h1>
    <p class="muted">There's a bug hidden in the stamp card site. Get your Tech Cell stamp to start hunting.</p>
  </div>
  <ol id="list"></ol>
  <section class="fast" id="fastBox" hidden><h2>Fastest fixes</h2><ol id="fast"></ol></section>
  <p class="empty" id="empty" hidden>Nobody has squashed it yet. Be the first.</p>
  <p class="how">Squashed it? Show your screen at this stall.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
async function load() {
  try {
    const rows = await (await fetch("/api/hall")).json();
    $("empty").hidden = rows.length > 0;
    const clock = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    const hearts = (n) => Number.isInteger(n) ? `<span class="hearts">${"\u2665".repeat(n)}</span>` : "";
    $("list").innerHTML = rows.map((r) => {
      const t = new Date(r.solvedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      return `<li class="${r.rank === 1 ? "first" : ""}"><span class="rank">#${r.rank}</span><span class="name">${esc(r.name)}</span>${hearts(r.hearts)}<span class="when">${esc(t)}</span></li>`;
    }).join("");
    // Speedrun board: quickest solves first, ties go to more hearts left.
    const fast = rows.filter((r) => Number.isInteger(r.seconds))
      .sort((x, y) => x.seconds - y.seconds || (y.hearts ?? 0) - (x.hearts ?? 0)).slice(0, 5);
    $("fastBox").hidden = !fast.length;
    $("fast").innerHTML = fast.map((r, i) =>
      `<li class="${i === 0 ? "first" : ""}"><span class="rank">${clock(r.seconds)}</span><span class="name">${esc(r.name)}</span>${hearts(r.hearts)}<span class="when stat">#${r.rank} overall</span></li>`).join("");
  } catch {}
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
