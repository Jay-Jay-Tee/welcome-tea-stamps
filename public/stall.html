<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stall screen</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .badge { display: flex; align-items: center; gap: 12px; border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: var(--c); color: var(--k); box-shadow: 4px 4px 0 var(--ink); margin: 6px 4px 16px 0; }
  .badge b { font-family: "DM Sans", system-ui, sans-serif; font-size: 1.25rem; }
  .badge small { display: block; opacity: .85; font-weight: 500; }
  #result { border: 2px solid var(--ink); border-radius: 16px; padding: 16px; margin: 16px 6px 16px 0; box-shadow: 6px 6px 0 var(--blue); background: #fff; }
  #result.ok { box-shadow: 6px 6px 0 var(--ok); }
  #result.warn { box-shadow: 6px 6px 0 var(--warn); background: #fffaf2; }
  #result.bad { box-shadow: 6px 6px 0 var(--bad); background: #fff6f5; }
  /* Large result stamp */
  .ink { display: inline-block; font-family: "DM Sans", system-ui, sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 4px solid var(--c); outline: 2px solid var(--c); outline-offset: 3px; border-radius: 10px; padding: 2px 14px; transform: rotate(-4deg); margin: 6px 0 12px; animation: thunk .4s cubic-bezier(.2, 1.4, .4, 1) both; --r: -4deg; }
  .ink.warn { color: var(--warn); border-color: var(--warn); outline-color: var(--warn); }
  .ink.bad { color: var(--bad); border-color: var(--bad); outline-color: var(--bad); }
  .swag { display: flex; align-items: center; gap: 10px; font-family: "DM Sans", system-ui, sans-serif; font-weight: 700; font-size: 1.15rem; padding: 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--tint); }
  .swag input { width: 26px; height: 26px; accent-color: var(--ok); }
  video { width: 100%; border-radius: 14px; border: 2px solid var(--ink); background: #000; max-height: 36vh; object-fit: cover; display: block; }
</style>
</head>
<body>
<main>
  <header class="top"><img src="/logo.png" alt=""><span>Welcome Tea<br>Volunteer screen</span></header>

  <section id="login" hidden>
    <h1>Log in to your station</h1>
    <p>Scan your station's login QR with your phone camera, or type in the 16 character key.</p>
    <input id="keyIn" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div class="row"><button id="keyGo">Start</button></div>
    <p class="banner bad" id="loginErr" hidden></p>
  </section>

  <section id="work" hidden>
    <div id="badge" class="badge"></div>
    <p class="banner warn" id="queueNote" hidden></p>
    <video id="video" playsinline muted hidden></video>
    <canvas id="canvas" hidden></canvas>
    <div class="row"><button id="camBtn" class="ghost">Start camera</button></div>
    <div class="row">
      <input id="manual" type="text" placeholder="Or type the 8 character code" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button id="manualGo">Go</button>
    </div>
    <div id="result" hidden></div>
    <hr>
    <p class="muted"><a href="#" id="logout">Log out this phone</a></p>
  </section>
</main>
<script src="/vendor/jsqr.js"></script>
<script src="/icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
// Anything that came from an attendee (nickname) goes through esc() before touching innerHTML.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clean = (s) => String(s ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const CODE_RE = /^[B-DF-HJKMNP-TV-Z25-9]{8}$/; // same alphabet as src/codes.ts

let key = null, me = null, lastCode = "", busy = false;

const post = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-key": key }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Request failed"), { status: r.status });
  return j;
};
const show = (cls, html) => { const r = $("result"); r.hidden = false; r.className = cls; r.innerHTML = html; };
const ink = (cls, text) => `<div class="ink ${cls}">${text}</div>`;
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const nextBtn = `<div class="row"><button id="next" class="ghost">Next person</button></div>`;
const wireNext = () => { if ($("next")) $("next").onclick = () => { lastCode = ""; $("result").hidden = true; }; };

// Offline queue: stamps that fail on a network error stay on this phone and retry. The server ignores repeats, so retrying is safe.
// Only a definite "this code doesn't exist" (404) drops one.
const queue = () => { try { return JSON.parse(store.get("queue:" + me.id) || "[]"); } catch { return []; } };
const saveQueue = (q) => {
  store.set("queue:" + me.id, JSON.stringify(q));
  $("queueNote").hidden = !q.length;
  $("queueNote").textContent = q.length + " stamp" + (q.length === 1 ? "" : "s") + " saved on this phone, waiting for wifi. Keep this page open.";
};
async function flush() {
  if (!me || me.kind !== "stall" || !queue().length) return;
  const rest = [];
  for (const c of queue()) { try { await post("/api/station/stamp", { code: c }); } catch (e) { if (e.status !== 404) rest.push(c); } }
  saveQueue(rest);
}
setInterval(flush, 8000);
window.addEventListener("online", flush);

async function handle(raw, manual) {
  const code = clean(raw);
  if (busy) return;
  // The camera keeps seeing the same card while it's held up. Ignore it until a different card or "Next person".
  if (!manual && code === lastCode) return;
  lastCode = code;
  if (!CODE_RE.test(code)) { show("bad", `<p class="big">That's not a stamp card</p><p>Scan the QR on their card page, or type the 8 character code under it.</p>`); return; }
  busy = true;
  try {
    if (me.kind === "stall") await stamp(code); else await redeem(code);
  } catch (e) {
    if (e.status === 404) show("bad", `<p class="big">No card with code ${esc(code)}</p><p>Check the code and try again.</p>` + nextBtn);
    else if (e.status === 401) { logout("This station's key was changed. Scan the new login QR."); }
    else if (!e.status && me.kind === "stall") {
      saveQueue([...new Set([...queue(), code])]);
      buzz(80);
      show("warn", `<p class="big">No connection. Stamp saved.</p><p>${esc(code)} will be stamped automatically when the connection is back. You can still give them their swag.</p>` + nextBtn);
    } else show("bad", `<p class="big">Couldn't do that</p><p>${esc(e.message)}. If the wifi is bad, try again in a moment.</p>` + nextBtn);
  } finally {
    busy = false; wireNext();
  }
}

async function stamp(code) {
  const r = await post("/api/station/stamp", { code });
  const who = r.nickname ? esc(r.nickname) : "Code " + esc(code);
  buzz(r.result === "stamped" ? 80 : [60, 60, 60]);
  show(r.result === "stamped" ? "ok" : "warn",
    (r.result === "stamped" ? ink("", "Stamped") : ink("warn", "Already") + `<p class="big">Already stamped at this stall</p>`) +
    `<p>${who}: <b>${r.count} of ${r.stampsRequired}</b> stamps.</p>
     <label class="swag"><input type="checkbox" id="swag" ${r.swagGiven ? "checked" : ""}> Swag handed over</label>
     <div class="row"><button id="undo" class="danger">Undo this stamp</button></div>` + nextBtn);
  $("swag").onchange = (e) => post("/api/station/swag", { code, given: e.target.checked })
    .catch(() => { e.target.checked = !e.target.checked; alert("Couldn't save the tick. Try again."); });
  $("undo").onclick = async () => {
    try { await post("/api/station/undo", { code }); show("warn", `<p class="big">Stamp removed</p><p>${esc(code)} no longer has your stall's stamp.</p>` + nextBtn); wireNext(); }
    catch { alert("Couldn't undo. Try again."); }
  };
}

async function redeem(code) {
  const r = await post("/api/station/redeem", { code });
  const [cls, title, body] = {
    redeemed: ["ok", "Give them a donut", "Marked as collected."],
    already: ["bad", "Already collected", "This card has already been used for a donut."],
    incomplete: ["bad", "Not a full card yet", `${r.count} of ${r.stampsRequired} stamps. Send them back to the stalls.`],
    out: ["warn", "No more donuts", "Donuts are marked as finished. Send them to a committee member."],
  }[r.result];
  buzz(r.result === "redeemed" ? 80 : [60, 60, 60]);
  show(cls, ink(cls === "ok" ? "" : cls, r.result === "redeemed" ? "Give donut" : r.result === "out" ? "Finished" : "No donut") + `<p class="big">${title}</p><p>${body}</p>` +
    (r.result === "redeemed" ? `<div class="row"><button id="undo" class="danger">Undo (wrong card)</button></div>` : "") + nextBtn);
  if ($("undo")) $("undo").onclick = async () => {
    try { await post("/api/station/unredeem", { code }); show("warn", `<p class="big">Claim removed</p><p>${esc(code)} can collect again.</p>` + nextBtn); wireNext(); }
    catch { alert("Couldn't undo. Try again."); }
  };
}

// Phones hand over 1080p frames. jsQR on that is slow on older Androids, so scan a 640px copy.
async function scanLoop() {
  const v = $("video"), c = $("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  if (v.readyState === v.HAVE_ENOUGH_DATA && !busy) {
    const scale = Math.min(1, 640 / v.videoWidth);
    c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const hit = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
    if (hit && hit.data) handle(hit.data, false);
  }
  setTimeout(scanLoop, 200);
}
$("camBtn").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    $("video").hidden = false; $("video").srcObject = stream; await $("video").play(); $("camBtn").hidden = true; scanLoop();
  } catch { show("warn", "Camera blocked. Allow camera access for this site in your browser settings, or type codes instead."); }
};
$("manualGo").onclick = () => { handle($("manual").value, true); $("manual").value = ""; };
$("manual").onkeydown = (e) => { if (e.key === "Enter") $("manualGo").click(); };

function logout(reason) {
  store.del("key"); store.del("me"); key = null; me = null;
  $("work").hidden = true; $("login").hidden = false;
  $("loginErr").hidden = !reason; $("loginErr").textContent = reason || "";
}
$("logout").onclick = (e) => { e.preventDefault(); if (confirm("Log out this phone? You'll need the login QR again.")) logout(); };
$("keyGo").onclick = () => start(clean($("keyIn").value));

async function start(k) {
  if (!k) { $("login").hidden = false; return; }
  key = k;
  try {
    const r = await fetch("/api/station/me", { headers: { "x-key": key } });
    if (r.status === 401) return logout("That key doesn't work. Ask the Tech Lead for this station's login QR.");
    if (!r.ok) throw new Error();
    me = await r.json();
    store.set("key", key); store.set("me", JSON.stringify(me));
  } catch {
    // No wifi at login. If this phone logged in with this key before, carry on and queue stamps.
    me = store.get("key") === key ? JSON.parse(store.get("me") || "null") : null;
    if (!me) { $("login").hidden = false; $("loginErr").hidden = false; $("loginErr").textContent = "No wifi, and this phone hasn't logged in before. Try again when connected."; return; }
  }
  $("login").hidden = true; $("work").hidden = false;
  const c = me.color || "#365486";
  $("badge").style.cssText = `--c:${c};--k:${Look.inkOn(c)}`;
  $("work").style.setProperty("--c", Look.readable(c));
  $("badge").innerHTML = `${Look.icon(me.icon, 36, "currentColor", 2.2)}<div><b></b><small>${me.kind === "donut" ? "Check full cards and give out donuts" : "Stamp cards and give out swag"}</small></div>`;
  $("badge").querySelector("b").textContent = me.name;
  saveQueue(queue()); flush();
}

// Login link from the admin QR: /stall.html#k=KEY. Take the key, then wipe it from the address bar so it isn't left on screen.
const fromHash = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1];
if (fromHash) history.replaceState(null, "", location.pathname);
start(clean(fromHash || store.get("key")));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
