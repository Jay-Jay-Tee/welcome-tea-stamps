# One-click setup: Render dashboard > New > Blueprint > pick this repo.
# Free plans, so no card is needed. Fine for a one-day event, with two catches:
# - the web service sleeps after 15 minutes with no visitors (first visit after that takes about a minute), so open the site before doors open;
# - the free Postgres is deleted after 30 days.
# For a longer run, change the web plan to starter and the database plan to basic-256mb (both paid).
services:
  - type: web
    name: welcome-tea-stamps
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: welcome-tea-db
          property: connectionString # internal address, no public hop
      - key: ADMIN_PIN
        sync: false # typed into the Render dashboard on first deploy, 12+ characters. Never committed.
      - key: RESET_PHRASE
        sync: false # typed into the Render dashboard; what you type to confirm "Wipe all cards and stamps"
      - key: PUBLIC_URL
        sync: false # optional, e.g. https://stamps.nuscomputing.com. Leave blank to use whatever address the page was opened on.

databases:
  - name: welcome-tea-db
    plan: free
    region: singapore
    ipAllowList: [] # no connections from outside Render
